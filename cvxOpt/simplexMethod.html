<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LP visualizer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: title, then canvas left and the LP editor + level slider right; stacks on phones. */
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --ink: #17202e;
  --muted: #5b6676;
  --rule: #d8dee7;
  --k1: #2f6fb0;
  --k2: #23866a;
  --k3: #7b4fb0;
  --k4: #8a7a1c;
  --k5: #b0522f;
  --k6: #2b8a99;
  --k7: #a33a6e;
  --k8: #5b6b1f;
  --level: #d27a1f;
  --opt: #c2364a;
  --face: #8592a5;
  --path: #b8338f;
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --panel: #161d27; --ink: #e6ebf2; --muted: #98a3b3; --rule: #2a3442;
    --k1: #6ea9e6; --k2: #5cc4a2; --k3: #b48ce8; --k4: #cdbb52; --k5: #e8875f; --k6: #5fc3d2; --k7: #e07aab; --k8: #a8bd5a;
    --level: #f0a24e; --opt: #f26b7e; --face: #7d8899; --path: #e47cc6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --panel: #161d27; --ink: #e6ebf2; --muted: #98a3b3; --rule: #2a3442;
  --k1: #6ea9e6; --k2: #5cc4a2; --k3: #b48ce8; --k4: #cdbb52; --k5: #e8875f; --k6: #5fc3d2; --k7: #e07aab; --k8: #a8bd5a;
  --level: #f0a24e; --opt: #f26b7e; --face: #7d8899; --path: #e47cc6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
html, body { height: 100%; }
.wrap {
  margin: 0; height: 100%;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; grid-template-rows: auto minmax(0, 1fr);
}
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.15; margin: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { font: 500 14px var(--font-mono); padding: 6px 18px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg button:focus-visible { outline: 2px solid var(--level); outline-offset: -2px; }

/* Desktop: the page fills the window. Canvas on the left takes all spare space;
   the right column (inputs + tableaus) scrolls on its own. Phone: normal page flow — inputs, view, legend, tableaus. */
.bench {
  display: grid; column-gap: 24px; row-gap: 8px; min-height: 0;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 440px);
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "viz side" "legend side";
}
.side { grid-area: side; min-height: 0; overflow: hidden; display: grid; gap: 20px; grid-template-rows: auto minmax(0, 1fr); }


.bench > .legend { grid-area: legend; margin: 0; }
.viz { grid-area: viz; margin: 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.stage { position: relative; flex: 1 1 auto; min-height: 260px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; max-width: 100%; overflow: hidden; }
@media (max-width: 880px) {
  html, body, .wrap { height: auto; }
  .wrap { grid-template-rows: none; }
  .bench { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; row-gap: 20px; grid-template-areas: "inputs" "viz" "legend" "simplex"; }
  .side { display: contents; }
  .bench #simgrid { overflow: visible; }
  .inputs { grid-area: inputs; }
  .simplex { grid-area: simplex; }
  .stage { flex: none; min-height: 0; aspect-ratio: 1 / 0.9; }
}
canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas:active { cursor: grabbing; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

aside { display: grid; gap: 18px; min-width: 0; }
.label { font-size: 12px; letter-spacing: .02em; color: var(--muted); font-weight: 500; }

.editor { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 14px; display: grid; gap: 10px; font-family: var(--font-mono); font-size: 14px; }
.row { display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; min-width: 0; }
.row .tag { width: 2.2em; flex: none; font-weight: 500; }
.row .kw { color: var(--muted); width: 2.2em; flex: none; font-size: 12px; }
.row .v { color: var(--muted); }
.row input {
  width: 3.4em; min-width: 0; flex: 0 1 3.4em; padding: 4px 4px; text-align: center;
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px;
}
.row input[aria-invalid="true"] { border-color: var(--opt); color: var(--opt); }
.row input:focus-visible, button:focus-visible, input[type="range"]:focus-visible { outline: 2px solid var(--level); outline-offset: 1px; }
.rm { flex: none; margin-left: auto; width: 26px; height: 26px; border: 0; background: transparent; color: var(--muted); font-size: 17px; cursor: pointer; border-radius: 4px; }
.rm:hover { color: var(--opt); }
.rm[disabled] { visibility: hidden; }
.sub { color: var(--muted); font-size: 12px; }
.tools { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--font-body); }
.linkbtn { border: 0; background: none; padding: 0; font: inherit; font-size: 14px; color: var(--k1); cursor: pointer; }
.linkbtn[disabled] { color: var(--muted); cursor: default; }
.err { font-family: var(--font-body); font-size: 13px; color: var(--opt); }

.slider { display: grid; gap: 4px; }
.readout { display: flex; justify-content: space-between; align-items: baseline; }
.readout b { font-family: var(--font-mono); font-weight: 500; font-size: 18px; color: var(--level); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--level); }
.result { font-size: 15px; }
.result b { color: var(--opt); font-weight: 500; }

.simplex { display: grid; gap: 12px; border-top: 1px solid var(--rule); padding-top: 18px; min-width: 0; min-height: 0; grid-template-rows: auto auto minmax(0, 1fr); align-content: start; }
#simgrid { min-height: 0; overflow-y: auto; scrollbar-gutter: stable; padding-right: 6px; padding-bottom: 4px; overflow-anchor: none; }
.simhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0; }
.rule { font-size: 13.5px; color: var(--muted); margin: 0; max-width: 75ch; }
.ctrls { display: flex; align-items: center; gap: 8px; }
.btn { font: inherit; font-size: 14px; font-weight: 500; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer; }
.btn:disabled { color: var(--muted); cursor: default; opacity: .6; }
.stepno { font-family: var(--font-mono); font-size: 13px; color: var(--muted); min-width: 7.5em; text-align: center; font-variant-numeric: tabular-nums; }
.simtext { margin: 0; max-width: 80ch; }
.simtext b { font-weight: 500; color: var(--path); }
.simgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 880px) { .simgrid { grid-template-columns: minmax(0, 1fr); } }
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; text-align: right; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
tbody tr:last-child td { border-bottom: 0; }
tr.objrow td { border-top: 2px solid var(--rule); }
td.rhs, th.rhs { border-left: 1px solid var(--rule); }
.ent { background: color-mix(in srgb, var(--path) 9%, transparent); }
tr.lv td { background: color-mix(in srgb, var(--path) 9%, transparent); }
th button.pv { font: inherit; color: var(--path); background: none; border: 0; padding: 2px 6px; margin: -2px -6px; border-radius: 4px; cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
th button.pv:hover { background: color-mix(in srgb, var(--path) 16%, transparent); }
th button.pv:focus-visible { outline: 2px solid var(--path); outline-offset: 1px; }
td.piv { background: color-mix(in srgb, var(--path) 28%, transparent); color: var(--ink); font-weight: 600; }
tr.pick td { color: var(--path); font-weight: 500; }
.simerr { color: var(--muted); }
.pair { display: flex; flex-direction: column; align-items: stretch; gap: 8px; min-width: 0; }
.tb { display: grid; gap: 6px; min-width: 0; max-width: 100%; }
.tb .tablewrap { max-width: 100%; }
.tb .label { text-transform: uppercase; letter-spacing: .07em; }
.tb table { table-layout: fixed; min-width: 340px; }
.pair .arrow { font-size: 20px; line-height: 1; color: var(--path); text-align: center; }
</style>

<div class="wrap">
  <header class="top">
    <h1>LP visualizer</h1>
    <div class="seg" role="group" aria-label="Number of variables">
      <button id="d2" aria-pressed="false">2D</button>
      <button id="d3" aria-pressed="true">3D</button>
    </div>
  </header>
  <div class="bench">
    <figure class="viz">
      <div class="stage"><canvas id="cv" aria-label="Rotatable 3D view of the feasible region"></canvas></div>
    </figure>
      <div class="legend">
        <span><i class="dot" style="background:var(--ink)"></i>corner of the feasible region</span>
        <span><i class="dot" style="background:var(--level)"></i>level set f = c</span>
        <span><i class="dot" style="background:var(--opt)"></i>maximum</span>
        <span><i class="dot" style="background:var(--path)"></i>simplex path</span>
      </div>

    <div class="side">
    <aside class="inputs">
      <div class="editor" id="editor" aria-label="Linear program editor"></div>
      <div class="slider">
        <div class="readout"><label for="c" class="label">level value c</label><b id="cval">6.00</b></div>
        <input type="range" id="c" min="0" max="22" step="0.05" value="6">
      </div>
      <div class="result" id="result"></div>
    </aside>

    <section class="simplex" aria-label="Simplex method">
      <h2>simplex method</h2>
      <p class="simtext" id="simtext"></p>
      <div id="simgrid" class="pair"></div>
    </section>
    </div>
  </div>
</div>

<script>
(function () {
  const EXAMPLE = { c: ["3","2","4"], A: [["0","1","2"], ["1","0","2"]], b: ["4","2"] };
  const MAXC = 8, KEY = "lp-explorer-v4";
  const clone = o => JSON.parse(JSON.stringify(o));
  const dropZ = l => ({ c: l.c.slice(0, 2), A: l.A.map(r => r.slice(0, 2)), b: l.b.slice() });
  const okLP = (s, n) => s && Array.isArray(s.c) && s.c.length === n && Array.isArray(s.A) && s.A.length && s.A.every(r => r.length === n) && Array.isArray(s.b) && s.b.length === s.A.length;
  const store = { dim: 3, lp3: clone(EXAMPLE), lp2: dropZ(EXAMPLE) };
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s) {
      if (okLP(s.lp3, 3)) store.lp3 = s.lp3;
      if (okLP(s.lp2, 2)) store.lp2 = s.lp2;
      if (s.dim === 2) store.dim = 2;
    } else {
      const old = JSON.parse(localStorage.getItem("lp-explorer-v3"));
      if (okLP(old, 3)) store.lp3 = old;
    }
  } catch (e) {}
  let dim = store.dim;
  let lp = dim === 3 ? store.lp3 : store.lp2;

  // ---------- math helpers ----------
  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const len = a => Math.hypot(a[0], a[1], a[2]);
  const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const close = (a, b) => len(sub(a, b)) < 1e-7 * (1 + len(a));
  function parseNum(s) {
    s = String(s).trim().replace(/−/g, "-");
    if (!/^[-+]?(\d+\.?\d*|\.\d+)(\/(\d+\.?\d*|\.\d+))?$/.test(s)) return NaN;
    const [p, q] = s.split("/");
    const v = q === undefined ? +p : +p / +q;
    return isFinite(v) ? v : NaN;
  }
  function frac(v) {
    if (Math.abs(v) < 1e-9) return "0";
    const sg = v < 0 ? "−" : ""; v = Math.abs(v);
    for (let q = 1; q <= 200; q++) { const p = Math.round(v*q); if (p > 0 && Math.abs(v*q - p) < 1e-6*q) return sg + (q === 1 ? p : p + "/" + q); }
    return sg + (+v.toFixed(3));
  }
  const fmtP = p => "(" + p.map(frac).join(", ") + ")";
  function solve3(a, b, c) {
    const det = dot(a.n, cross(b.n, c.n));
    const sc = len(a.n) * len(b.n) * len(c.n);
    if (Math.abs(det) < 1e-10 * sc) return null;
    const r = [a.b, b.b, c.b];
    const M = [a.n, b.n, c.n];
    const col = (k) => M.map((row, i) => row.map((v, j) => j === k ? r[i] : v));
    const d3 = m => dot(m[0], cross(m[1], m[2]));
    return [d3(col(0)) / det, d3(col(1)) / det, d3(col(2)) / det];
  }
  function orderInPlane(pts, n) {
    if (pts.length < 3) return pts;
    const g = pts.reduce((s, p) => [s[0]+p[0]/pts.length, s[1]+p[1]/pts.length, s[2]+p[2]/pts.length], [0,0,0]);
    const ax = Math.abs(n[0]) < Math.abs(n[1]) ? (Math.abs(n[0]) < Math.abs(n[2]) ? [1,0,0] : [0,0,1]) : (Math.abs(n[1]) < Math.abs(n[2]) ? [0,1,0] : [0,0,1]);
    const u = cross(n, ax), w = cross(n, u);
    return pts.slice().sort((p, q) => Math.atan2(dot(sub(p,g), w), dot(sub(p,g), u)) - Math.atan2(dot(sub(q,g), w), dot(sub(q,g), u)));
  }
  function planeBox(n, b, E) {
    const pts = [];
    const corner = m => [m & 1 ? E[0] : 0, m & 2 ? E[1] : 0, m & 4 ? E[2] : 0];
    for (let m = 0; m < 8; m++) for (const bit of [1, 2, 4]) {
      if (m & bit) continue;
      const A = corner(m), B = corner(m | bit), fa = dot(n, A) - b, fb = dot(n, B) - b;
      let p = null;
      if (Math.abs(fa) < 1e-12) p = A;
      else if (fa * fb < 0) { const t = fa / (fa - fb); p = [A[0]+t*(B[0]-A[0]), A[1]+t*(B[1]-A[1]), A[2]+t*(B[2]-A[2])]; }
      if (p && !pts.some(q => close(q, p))) pts.push(p);
    }
    return orderInPlane(pts, n);
  }

  function enumerate(cons, clip) {
    const planes = [];
    cons.forEach(k => { if (len(k.n) > 1e-12) planes.push({ n: k.n, b: k.b, kind: k.kind }); });
    for (let i = 0; i < 3; i++) { const n = [0,0,0]; n[i] = -1; planes.push({ n, b: 0, kind: "face" }); }
    for (let i = 0; i < 3; i++) { const n = [0,0,0]; n[i] = 1; planes.push({ n, b: clip[i], kind: "clip" }); }
    const tol = (pl, p) => 1e-7 * (1 + Math.abs(pl.b) + len(pl.n) * len(p));
    const feas = p => cons.every(k => dot(k.n, p) <= k.b + tol(k, p)) && p.every((v, i) => v >= -1e-7 * (1 + clip[i]) && v <= clip[i] + 1e-7 * (1 + clip[i]));
    const verts = [];
    for (let i = 0; i < planes.length; i++) for (let j = i+1; j < planes.length; j++) for (let l = j+1; l < planes.length; l++) {
      let p = solve3(planes[i], planes[j], planes[l]);
      if (!p || !feas(p)) continue;
      p = p.map(v => Math.abs(v) < 1e-10 ? 0 : v);
      if (!verts.some(v => close(v.p, p))) verts.push({ p });
    }
    verts.forEach(v => {
      v.act = planes.map((pl, k) => Math.abs(dot(pl.n, v.p) - pl.b) <= tol(pl, v.p) ? k : -1).filter(k => k >= 0);
      v.clip = v.act.some(k => planes[k].kind === "clip");
    });
    return { planes, verts };
  }

  function build(lp) {
    const c = lp.c.map(parseNum), A = lp.A.map(r => r.map(parseNum)), b = lp.b.map(parseNum);
    if (c.some(isNaN) || A.some(r => r.some(isNaN)) || b.some(isNaN)) return null;
    const cons = A.map((n, i) => ({ n, b: b[i], kind: "k" + (i+1) }));
    const intercepts = [];
    cons.forEach(k => { if (len(k.n) > 1e-12) for (let i = 0; i < 3; i++) if (Math.abs(k.n[i]) > 1e-12) {
      const t = k.b / k.n[i]; if (t > 1e-9) { const p = [0,0,0]; p[i] = t; if (!intercepts.some(q => close(q, p))) intercepts.push(p); }
    }});
    const zeroBad = cons.some(k => len(k.n) <= 1e-12 && k.b < 0);
    const big = zeroBad ? { verts: [] } : enumerate(cons, [1e4, 1e4, 1e4]);
    const fv = p => dot(c, p);
    let E = [0, 0, 0];
    intercepts.forEach(p => p.forEach((v, i) => E[i] = Math.max(E[i], v)));
    if (!big.verts.length) {
      E = E.map(e => Math.max(e * 1.12, 1));
      return { infeasible: true, c, cons, E, intercepts, verts: [], faces: [], edges: [], real: [], opt: [] };
    }
    const real = big.verts.filter(v => !v.clip).map(v => v.p);
    const regionUnb = big.verts.some(v => v.clip);
    const fReal = Math.max(...real.map(fv));
    const fBig = Math.max(...big.verts.map(v => fv(v.p)));
    const unbounded = fBig > fReal + 1e-6 * (1 + Math.abs(fReal));
    real.forEach(p => p.forEach((v, i) => E[i] = Math.max(E[i], v)));
    if (regionUnb) { const m = Math.max(...E, 1) * 1.5; E = [m, m, m]; }
    else E = E.map(e => Math.max(e * 1.12, 1));

    const d = enumerate(cons, E);
    const faces = [];
    d.planes.forEach((pl, k) => {
      const pts = d.verts.filter(v => v.act.includes(k)).map(v => v.p);
      if (pts.length >= 3) faces.push({ pts: orderInPlane(pts, pl.n), kind: pl.kind });
    });
    const edges = [];
    for (let i = 0; i < d.verts.length; i++) for (let j = i+1; j < d.verts.length; j++) {
      const com = d.verts[i].act.filter(k => d.verts[j].act.includes(k));
      if (com.length >= 2) edges.push({ a: d.verts[i].p, b: d.verts[j].p, clip: com.some(k => d.planes[k].kind === "clip") });
    }
    const czero = len(c) < 1e-12;
    const opt = (unbounded || czero) ? [] : real.filter(p => fv(p) >= fReal - 1e-7 * (1 + Math.abs(fReal)));
    const hollow = intercepts.filter(p => !real.some(q => close(q, p)));
    const fAll = d.verts.map(v => fv(v.p));
    return { c, cons, E, real, opt, hollow, faces, edges, verts: d.verts, unbounded, czero, fmax: fReal,
             flo: Math.min(...fAll), fhi: Math.max(...fAll) };
  }

  // ---------- 2D geometry ----------
  const len2 = a => Math.hypot(a[0], a[1]);
  const close2 = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]) < 1e-7 * (1 + len2(a));
  function solve2(a, b) {
    const det = a.n[0]*b.n[1] - a.n[1]*b.n[0];
    if (Math.abs(det) < 1e-10 * len2(a.n) * len2(b.n)) return null;

    if (active) {
      sec = section(c);
      if (sec.length >= 3) { const pr = sec.map(project); items.push({ kind: "sec", pr, d: pr.reduce((s, q) => s + q.d, 0) / pr.length - 0.05 }); }
    }
    items.sort((a, b) => b.d - a.d).forEach(it => {
      if (it.kind === "sec") poly(it.pr, rgba(colors["--level"], 0.55), colors["--level"], 2);
      else if (it.kind === "clip") poly(it.pr, rgba(colors["--face"], 0.05), null);
      else {
        const col = it.kind === "face" ? colors["--face"] : colors["--" + it.kind];
        poly(it.pr, rgba(col, it.kind === "face" ? 0.12 : 0.26), null);
      }
    });
    if (sec.length === 2) line(project(sec[0]), project(sec[1]), colors["--level"], 2.5);
    M.edges.forEach(e => line(project(e.a), project(e.b), rgba(colors["--ink"], e.clip ? 0.3 : 0.75), e.clip ? 1 : 1.2, e.clip ? [3, 3] : null));
    markOptSet(project, pts => orderInPlane(pts, M.c));


    // simplex path
    const cur = null;
    drawPath(project);

    // points
    [].forEach(p => {
      const P = project(p);
      ctx.fillStyle = colors["--panel"]; ctx.strokeStyle = colors["--muted"]; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(P.x, P.y, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    });
    const mid = M.real.length ? project(M.real.reduce((s, p) => [s[0]+p[0], s[1]+p[1], s[2]+p[2]], [0,0,0]).map(v => v / M.real.length)) : o;
    M.real.forEach(p => {
      const P = project(p), isOpt = M.opt.some(q => close(q, p));
      ctx.fillStyle = isOpt ? colors["--opt"] : colors["--ink"];
      ctx.beginPath(); ctx.arc(P.x, P.y, isOpt ? 5.5 : 3.5, 0, Math.PI*2); ctx.fill();
      if (!isOpt) return;
      ctx.strokeStyle = colors["--opt"]; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(P.x, P.y, 10, 0, Math.PI*2); ctx.stroke();
      return;
      const txt = fmtP(p);
      ctx.font = "500 11.5px " + mono;
      const w = ctx.measureText(txt).width;
      let dx = P.x - mid.x, dy = P.y - mid.y; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
      let lx = P.x + dx*14 + (dx < -0.3 ? -w : dx > 0.3 ? 0 : -w/2), ly = P.y + dy*14 + 4;
      lx = Math.max(4, Math.min(W - w - 4, lx)); ly = Math.max(12, Math.min(H - 4, ly));
      label(txt, lx, ly, colors["--opt"], 500);
    });
    if (cur) {
      const P = project(cur.point);
      ctx.strokeStyle = colors["--path"]; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(P.x, P.y, 14, 0, Math.PI*2); ctx.stroke();
    }
  }
  // Highlight a tied optimum: the whole optimal edge or face in red
  function markOptSet(proj, order) {
    if (!M.opt || M.opt.length < 2) return;
    const oc = colors["--opt"];
    if (M.opt.length === 2) { line(proj(M.opt[0]), proj(M.opt[1]), oc, 4); return; }
    const pr = order(M.opt).map(proj);
    poly(pr, rgba(oc, 0.35), oc, 3);
  }
  function arrowLine(A, B, color, lw, dash) {
    if (Math.hypot(B.x - A.x, B.y - A.y) < 3) return;
    line(A, B, color, lw, dash);
    const ang = Math.atan2(B.y - A.y, B.x - A.x), s = 6 + lw * 1.5;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(B.x, B.y);
    ctx.lineTo(B.x - s*Math.cos(ang - 0.4), B.y - s*Math.sin(ang - 0.4));
    ctx.lineTo(B.x - s*Math.cos(ang + 0.4), B.y - s*Math.sin(ang + 0.4));
    ctx.closePath(); ctx.fill();
  }

  // ---------- simplex panel ----------
  const fnum = v => { const s = frac(v); return s.length > 9 ? (+v.toFixed(3)).toString().replace("-", "−") : s; };
  function renderSimplex() {
    const txt = document.getElementById("simtext"), grid = document.getElementById("simgrid");
    if (!sim || sim.error) {
      txt.innerHTML = `<span class="simerr">${sim ? sim.error : ""}</span>`;
      txt.hidden = false; grid.hidden = true;
      return;
    }
    grid.hidden = false; txt.hidden = true;
    const keep = grid.scrollTop;
    queueMicrotask(() => { grid.scrollTop = keep; });
    grid.innerHTML = sim.steps.map((s, i) =>
      (i ? `<div class="arrow" aria-hidden="true">↓</div>` : "") +
      `<div class="tb"><div class="tablewrap"><table>${tableHTML(s, i)}</table></div></div>`
    ).join("");
  }
  function tableHTML(s, ti) {
    const nm = sim.names, nv = sim.nv;
    const en = s.enter, lvr = s.leave;
    const head = nm.map((n, j) => {
      const can = !s.basis.includes(j) && ratioRow(s, j) >= 0;
      const cls = [j === en ? "ent" : "", can ? "pick" : ""].join(" ").trim();
      return can
        ? `<th class="${cls}"><button class="pv" data-t="${ti}" data-j="${j}" aria-label="Pivot on ${n}">${n}</button></th>`
        : `<th class="${cls}">${n}</th>`;
    }).join("");
    let h = `<thead><tr><th>basis</th>${head}<th class="rhs">RHS</th></tr></thead><tbody>`;
    s.T.forEach((r, i) => {
      h += `<tr class="${i === lvr ? "lv" : ""}"><td>${nm[s.basis[i]]}</td>` +
        r.slice(0, nv).map((v, j) => `<td class="${j === en ? (i === lvr ? "piv" : "ent") : ""}">${fnum(v)}</td>`).join("") +
        `<td class="rhs">${fnum(r[nv])}</td></tr>`;
    });
    h += `<tr class="objrow"><td>f</td>${s.obj.slice(0, nv).map((v, j) => `<td class="${j === en ? "ent" : ""}">${fnum(v)}</td>`).join("")}<td class="rhs">${fnum(s.obj[nv])}</td></tr></tbody>`;
    return h;
  }
  document.getElementById("simgrid").addEventListener("click", e => {
    const b = e.target.closest("button.pv"); if (!b) return;
    pivotAt(+b.dataset.t, +b.dataset.j);
  });
  // arrows only for the pivots that have been chosen
  function drawPath(proj) {
    if (!sim || !sim.steps) return;
    const S = sim.steps, pc = colors["--path"];
    for (let i = 1; i < S.length; i++) arrowLine(proj(S[i-1].point), proj(S[i].point), pc, 2.6);
  }

  function renderResult() {
    const r = document.getElementById("result");
    if (!M) return;
    if (M.infeasible) r.textContent = "No point satisfies all the constraints, so there is nothing to maximize.";
    else if (M.unbounded) r.textContent = "f has no maximum: the region keeps going in a direction where f grows without limit.";
    else if (M.czero) r.textContent = "All objective coefficients are 0, so f = 0 everywhere.";
    else if (M.opt.length === 1) r.innerHTML = `maximum <b>f = ${frac(M.fmax)}</b> at ${fmtP(M.opt[0])}`;
    else r.innerHTML = `maximum <b>f = ${frac(M.fmax)}</b> at ${M.opt.length === 2 ? "edge" : "face"} ${M.opt.map(fmtP).join(", ")}`;
  }
  function setSlider(reset) {
    const off = !M || M.infeasible || M.czero || M.fhi - M.flo < 1e-9;
    slider.disabled = off;
    if (off) { document.getElementById("cval").textContent = "–"; return; }
    const lo = M.flo, hi = M.fhi;
    slider.min = lo; slider.max = hi; slider.step = "any";
    if (reset || st.c < lo || st.c > hi) st.c = lo + 0.3 * (M.fhi - lo);
    slider.value = st.c;
    document.getElementById("cval").textContent = st.c.toFixed(2);
  }
  function update(reset) {
    const m = dim === 3 ? build(lp) : build2(lp);
    if (!m) return;
    M = m;
    store.dim = dim; store[dim === 3 ? "lp3" : "lp2"] = lp;
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
    sim = runSimplex(M.c, M.cons.map(k => k.n), M.cons.map(k => k.b));
    st.step = 0;
    fit(); setSlider(reset); renderResult(); renderSimplex(); draw();
  }

  slider.addEventListener("input", () => { st.c = +slider.value; document.getElementById("cval").textContent = st.c.toFixed(2); draw(); });

  // 3D: drag to rotate. 2D: drag to pan. Both: wheel / pinch to zoom.
  const ptrs = new Map();
  let drag = null, pinch = null;
  const local = (x, y) => { const r = cv.getBoundingClientRect(); return [x - r.left, y - r.top]; };
  cv.addEventListener("pointerdown", e => {
    cv.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, yaw: st.yaw, pitch: st.pitch, px: v2.px, py: v2.py,
                                  pan3: dim === 3 && (e.button === 2 || e.shiftKey), off: off3.slice() };
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), zoom: dim === 2 ? v2.zoom : st.zoom }; drag = null; }
  });
  cv.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && ptrs.size === 2) {
      const [a, b] = [...ptrs.values()], ratio = Math.hypot(a.x - b.x, a.y - b.y) / pinch.d;
      if (dim === 2) { const [mx, my] = local((a.x + b.x) / 2, (a.y + b.y) / 2); zoomAt(mx, my, pinch.zoom * ratio); }
      else st.zoom = Math.max(0.35, Math.min(4, pinch.zoom * ratio));
    } else if (drag) {
      if (dim === 2) { v2.px = drag.px + (e.clientX - drag.x); v2.py = drag.py + (e.clientY - drag.y); }
      else if (drag.pan3) {
        // move the rotation origin so the scene follows the pointer
        const s = scale * st.zoom, dx = (e.clientX - drag.x) / s, dy = (e.clientY - drag.y) / s;
        const cy = Math.cos(st.yaw), sy = Math.sin(st.yaw), cp = Math.cos(st.pitch), sp = Math.sin(st.pitch);
        const R = [cy, -sy, 0], U = [sy * sp, cy * sp, cp];
        for (let i = 0; i < 3; i++) off3[i] = drag.off[i] - R[i] * dx + U[i] * dy;
      } else {
        st.yaw = drag.yaw + (e.clientX - drag.x) * 0.01;
        st.pitch = Math.max(-0.2, Math.min(1.45, drag.pitch + (e.clientY - drag.y) * 0.008));
      }
    }
    draw();
  });
  const end = e => { ptrs.delete(e.pointerId); pinch = null; drag = null; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  cv.addEventListener("contextmenu", e => e.preventDefault());
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    const k = Math.exp(-e.deltaY * 0.0015);
    if (dim === 2) { const [mx, my] = local(e.clientX, e.clientY); zoomAt(mx, my, v2.zoom * k); }
    else st.zoom = Math.max(0.35, Math.min(4, st.zoom * k));
    draw();
  }, { passive: false });

  // 2D / 3D switch
  function renderDim() {
    document.getElementById("d2").setAttribute("aria-pressed", String(dim === 2));
    document.getElementById("d3").setAttribute("aria-pressed", String(dim === 3));
    cv.setAttribute("aria-label", dim === 3 ? "Rotatable 3D view of the feasible region" : "2D view of the feasible region; drag to pan, scroll to zoom");
  }
  function setDim(d) {
    if (d === dim) return;
    if (d === 2) { store.lp3 = lp; lp = dropZ(store.lp3); }
    else { lp = store.lp3; }
    dim = d;
    v2.zoom = 1; v2.px = 0; v2.py = 0; off3.fill(0);
    renderDim(); renderEditor(); update(true);
  }
  document.getElementById("d2").addEventListener("click", () => setDim(2));
  document.getElementById("d3").addEventListener("click", () => setDim(3));

  const refresh = () => { readColors(); draw(); };
  try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refresh); } catch (e) {}
  new MutationObserver(refresh).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refresh);

  readColors();
  renderDim();
  renderEditor();
  update(true);
  st.c = Math.min(Math.max(6, +slider.min), +slider.max); slider.value = st.c;
  document.getElementById("cval").textContent = st.c.toFixed(2);
  new ResizeObserver(resize).observe(cv);
})();
</script>

</body></html>
